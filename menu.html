<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Freshly Kit Menu</title>
<meta name="description" content="This week's Freshly smoothie kits. Fill a box of 6, 12 or 24.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Mansalva&family=Parkinsans:wght@300..800&display=swap">
<link rel="stylesheet" href="css/site.css?v=20261005f">
</head>
<body>

<main>
  <section class="section on-oat" aria-labelledby="menu-title" style="padding-bottom: clamp(36px, 5vw, 70px);">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow">The menu</p>
        <h1 id="menu-title" style="font-size: clamp(2.6rem, 8.5vw, 8rem);">This week’s kits</h1>
        <p class="lede">Eight cups, each named for what is in it. Hover a kit to cut it open, tap it for the details, and fill your box.</p>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter kits"></div>
      <p id="count" class="eyebrow" style="margin: 22px 0 14px;" aria-live="polite"></p>
      <div class="kits" id="grid"></div>
    </div>
  </section>

  <div class="boxbar" id="box" role="region" aria-label="Your box">
    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <span class="box-orange" id="box-orange" aria-hidden="true"></span>
      <strong class="sum" id="sum"></strong>
      <div class="sizes" id="sizes" role="group" aria-label="Box size"></div>
    </div>
    <div class="slots" id="slots" aria-hidden="true"></div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="btn ghost" id="empty" type="button" style="padding:10px 16px; font-size:.9rem;">Empty</button>
      <button class="btn" id="checkout" type="button" style="padding:10px 18px; font-size:.95rem;">Check out</button>
    </div>
  </div>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/assets.js?v=20261005f"></script>
<script src="js/fresh.js?v=20261005f"></script>
<script src="js/menu.js?v=20261005f"></script>
</body>
</html>
